name: Rust CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: sqlite:test.db

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev
        
    - name: Setup Database
      run: |
        sqlite3 test.db < migrations/20240101000001_create_user_tables.sql
        sqlite3 test.db < migrations/20240101000002_add_tier_to_user.sql

    - name: Check
      run: cargo check --all-targets

    - name: Build
      run: cargo build --release
