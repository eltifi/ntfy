[package]
name = "ntfy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
uuid = { version = "1.20", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.12"
once_cell = "1.21"
dashmap = "6.1" # Concurrent map for topics/visitors
base64 = "0.22"
mime_guess = "2.0"
headers = "0.4"
config = "0.15"
rand = "0.10"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }
tokio-util = { version = "0.7", features = ["io"] }
http-body = "1.0"
http-body-util = "0.1"
bcrypt = "0.18"
serde_urlencoded = "0.7"
bytes = "1.11"
lettre = { version = "0.11", features = ["tokio1", "rustls-tls", "smtp-transport", "builder", "tokio1-rustls"], default-features = false }
mail-parser = "0.11"
governor = "0.10"
nonzero_ext = "0.3"
rpassword = "7.4"
rust-embed = "8.11"
web-push = "0.11"
reqwest = { version = "0.13", features = ["json"] }
yup-oauth2 = "12.1"
url = "2.5"
hyper-util = { version = "0.1", features = ["client-legacy"] }
hyper-rustls = { version = "0.27", features = ["rustls-platform-verifier"] }
tempfile = "3.25"
colored = "3.1"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = "abort"     # Remove stack unwinding code
strip = true        # Automatically strip symbols from the binary